name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 如果您的預設分支是 master，請改為 master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node ⚙️
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build
        env:
          VITE_GOOGLE_APP_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_APP_SCRIPT_URL }}
          VITE_PASS_THRESHOLD: ${{ secrets.VITE_PASS_THRESHOLD }}
          VITE_QUESTION_COUNT: ${{ secrets.VITE_QUESTION_COUNT }}

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
